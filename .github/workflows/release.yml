name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,       target: x86_64-unknown-linux-musl,  bin: tar.gz, extra_target: "" }
          - { os: ubuntu-24.04-arm,    target: aarch64-unknown-linux-musl, bin: tar.gz, extra_target: "" }
          # One macOS job (10x billing multiplier) cross-builds both arches —
          # the crate is pure Rust, so x86_64-apple-darwin cross-compiles fine.
          - { os: macos-latest,        target: aarch64-apple-darwin,       bin: tar.gz, extra_target: x86_64-apple-darwin }
          - { os: windows-latest,      target: x86_64-pc-windows-msvc,     bin: zip,    extra_target: "" }
    steps:
      - uses: actions/checkout@v4

      - name: Install musl toolchain
        if: matrix.bin == 'tar.gz' && contains(matrix.target, 'linux-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            ${{ matrix.target }}
            ${{ matrix.extra_target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build extra target (macOS cross)
        if: matrix.extra_target != ''
        run: cargo build --release --target ${{ matrix.extra_target }}

      - name: Package (unix)
        if: matrix.bin == 'tar.gz'
        shell: bash
        run: |
          for t in "${{ matrix.target }}" ${{ matrix.extra_target }}; do
            [ -n "$t" ] || continue
            stage="zeroscript-${GITHUB_REF_NAME}-$t"
            mkdir -p "$stage"
            cp "target/$t/release/zsc" "target/$t/release/zpm" "$stage/"
            tar -czf "${stage}.tar.gz" "$stage"
          done

      - name: Package (windows)
        if: matrix.bin == 'zip'
        shell: bash
        run: |
          stage="zeroscript-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/zsc.exe" "target/${{ matrix.target }}/release/zpm.exe" "$stage/"
          7z a "${stage}.zip" "$stage"

      - uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.target }}
          path: |
            zeroscript-*.tar.gz
            zeroscript-*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          assets=(zeroscript-*)
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "ZeroScript $GITHUB_REF_NAME — see https://github.com/$GITHUB_REPOSITORY/blob/main/README.md" \
            "${assets[@]}"
